<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#6366f1" />
    <meta name="description" content="Kor'tana - Autonomous AI constellation with multimodal capabilities" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />

    <!-- iOS Meta Tags -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Kor'tana" />
    <link rel="apple-touch-icon" href="/icon-192.png" />

    <!-- Favicon -->
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512.png" />

    <title>Kor'tana - AI Constellation</title>
</head>

<body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>

    <!-- Register Service Worker only for injected production runtime.
         For local/LAN access, aggressively unregister stale workers so the
         backend-injected runtime config always wins. -->
    <script>
        if ('serviceWorker' in navigator) {
            window.addEventListener('load', async () => {
                const runtime = window.__KORTANA__;
                const shouldRegister =
                    window.location.protocol === 'https:' &&
                    runtime &&
                    runtime.ENVIRONMENT === 'production';

                if (!shouldRegister) {
                    const registrations = await navigator.serviceWorker.getRegistrations();
                    await Promise.all(registrations.map((registration) => registration.unregister()));
                    return;
                }

                navigator.serviceWorker.register('/sw.js')
                    .then((registration) => {
                        console.log('🌌 Kor\'tana Service Worker registered:', registration);
                    })
                    .catch((error) => {
                        console.log('Service Worker registration failed:', error);
                    });
            });
        }
    </script>
</body>

</html>
