services:
  devcontainer:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    container_name: kortana-devcontainer
    working_dir: /workspace
    command: sleep infinity
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql+asyncpg://postgres:${DB_PASSWORD:-kortana_dev}@postgres:5432/${DB_NAME:-kortana_db}
      REDIS_URL: redis://redis:6379/0
      DB_HOST: postgres
      REDIS_HOST: redis
      KORTANA_WORKSPACE_ROOT: /workspace
      PYTHONUNBUFFERED: "1"
      PYTHONPATH: /workspace/backend:/workspace/backend/src:/workspace/src
    volumes:
      - .:/workspace:cached
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - kortana-network
