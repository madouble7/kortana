# ============================================
# Kor'tana - Docker Compose Development
# ============================================
# Complete development environment with all services

version: "3.9"

services:
  # ==========================================
  # Infrastructure Services
  # ==========================================
  
  postgres:
    image: postgres:16-alpine
    container_name: kortana-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-kortana}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kortana_dev}
      POSTGRES_DB: ${DB_NAME:-kortana_db}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --locale=en_US.UTF-8"
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sh:/docker-entrypoint-initdb.d/init-db.sh:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kortana} -d ${DB_NAME:-kortana_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - kortana-network

  redis:
    image: redis:7-alpine
    container_name: kortana-redis
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 5s
    networks:
      - kortana-network

  # ==========================================
  # Core Application Services
  # ==========================================

  backend:
    build:
      context: ./kortana/backend
      dockerfile: Dockerfile
      args:
        - BUILD_DATE=${BUILD_DATE:-now}
        - VERSION=${VERSION:-1.0.0}
    container_name: kortana-backend
    restart: unless-stopped
    env_file:
      - .env
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-kortana}:${DB_PASSWORD:-kortana_dev}@postgres:5432/${DB_NAME:-kortana_db}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-10}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-20}
      
      # Redis
      REDIS_URL: redis://redis:6379/0
      CACHE_TTL: ${CACHE_TTL:-300}
      
      # Application
      ENVIRONMENT: ${ENVIRONMENT:-development}
      LOG_LEVEL: ${LOG_LEVEL:-debug}
      DEBUG: ${DEBUG:-true}
      
      # API Keys (from .env)
      OPENAI_API_KEY: ${OPENAI_API_KEY}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY}
      
      # Python
      PYTHONUNBUFFERED: 1
      PYTHONDONTWRITEBYTECODE: 1
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./kortana/backend:/app
      - backend_logs:/app/logs
    networks:
      - kortana-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  frontend:
    build:
      context: ./kortana/frontend
      dockerfile: Dockerfile.dev
    container_name: kortana-frontend
    restart: unless-stopped
    environment:
      REACT_APP_API_URL: ${FRONTEND_API_URL:-http://localhost:8000}
      REACT_APP_WS_URL: ${FRONTEND_WS_URL:-ws://localhost:8000}
      NODE_ENV: development
      CHOKIDAR_USEPOLLING: ${CHOKIDAR_USEPOLLING:-false}
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    depends_on:
      - backend
    volumes:
      - ./kortana/frontend/src:/app/src
      - ./kortana/frontend/public:/app/public
      - frontend_node_modules:/app/node_modules
    networks:
      - kortana-network
    stdin_open: true
    tty: true

  # ==========================================
  # Utility Services
  # ==========================================

  background-agent:
    build:
      context: ./utilities/background-agent
      dockerfile: Dockerfile
    container_name: kortana-background-agent
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/1
      BACKEND_URL: http://backend:8000
      LOG_LEVEL: ${LOG_LEVEL:-info}
    ports:
      - "8001:8001"
    depends_on:
      redis:
        condition: service_healthy
      backend:
        condition: service_healthy
    volumes:
      - ./utilities/background-agent:/app
      - agent_data:/app/data
    networks:
      - kortana-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8001/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  heartbeat-service:
    build:
      context: ./utilities/heartbeat-service
      dockerfile: Dockerfile
    container_name: kortana-heartbeat
    restart: unless-stopped
    env_file:
      - .env
    environment:
      BACKEND_URL: http://backend:8000
      CHECK_INTERVAL: ${HEARTBEAT_INTERVAL:-30}
    ports:
      - "8002:8002"
    depends_on:
      - backend
    volumes:
      - ./utilities/heartbeat-service:/app
    networks:
      - kortana-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8002/ping"]
      interval: 15s
      timeout: 5s
      retries: 3

  hub-dispatcher:
    build:
      context: ./utilities/hub-dispatcher
      dockerfile: Dockerfile
    container_name: kortana-hub-dispatcher
    restart: unless-stopped
    env_file:
      - .env
    environment:
      REDIS_URL: redis://redis:6379/2
      BACKEND_URL: http://backend:8000
    ports:
      - "8003:8003"
    depends_on:
      redis:
        condition: service_healthy
    volumes:
      - ./utilities/hub-dispatcher:/app
      - hub_data:/app/data
    networks:
      - kortana-network

  # ==========================================
  # Monitoring & Observability (Optional)
  # ==========================================

  prometheus:
    image: prom/prometheus:latest
    container_name: kortana-prometheus
    restart: unless-stopped
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/usr/share/prometheus/console_libraries'
      - '--web.console.templates=/usr/share/prometheus/consoles'
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    networks:
      - kortana-network
    profiles:
      - monitoring

  grafana:
    image: grafana/grafana:latest
    container_name: kortana-grafana
    restart: unless-stopped
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: false
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./monitoring/grafana/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./monitoring/grafana/datasources:/etc/grafana/provisioning/datasources:ro
    depends_on:
      - prometheus
    networks:
      - kortana-network
    profiles:
      - monitoring

# ==========================================
# Volumes
# ==========================================
volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  backend_logs:
    driver: local
  frontend_node_modules:
    driver: local
  agent_data:
    driver: local
  hub_data:
    driver: local
  prometheus_data:
    driver: local
  grafana_data:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  kortana-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16
