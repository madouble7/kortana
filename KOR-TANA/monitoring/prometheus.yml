# ============================================
# Prometheus Configuration
# ============================================

global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    cluster: 'kortana'
    environment: 'development'

scrape_configs:
  # Backend API metrics
  - job_name: 'kortana-backend'
    static_configs:
      - targets: ['backend:8000']
        labels:
          service: 'backend'
    metrics_path: '/metrics'

  # Background Agent metrics
  - job_name: 'background-agent'
    static_configs:
      - targets: ['background-agent:8001']
        labels:
          service: 'background-agent'
    metrics_path: '/metrics'

  # Heartbeat Service metrics
  - job_name: 'heartbeat-service'
    static_configs:
      - targets: ['heartbeat-service:8002']
        labels:
          service: 'heartbeat'
    metrics_path: '/metrics'

  # Redis metrics (if exporter is used)
  - job_name: 'redis'
    static_configs:
      - targets: ['redis:6379']
        labels:
          service: 'redis'

  # PostgreSQL metrics (if exporter is used)
  - job_name: 'postgres'
    static_configs:
      - targets: ['postgres:5432']
        labels:
          service: 'postgres'
