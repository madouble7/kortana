[tool.poetry]
name = "kortana-heartbeat-service"
version = "0.1.0"
description = "A minimal heartbeat service for Kor'tana that refreshes her token and logs a message indicating she is awake."
authors = ["Your Name <youremail@example.com>"]
license = "MIT"

[tool.poetry.dependencies]
python = "^3.8"
fastapi = "^0.75.0"
requests = "^2.26.0"
python-dotenv = "^0.19.2"
apscheduler = "^3.9.1"

[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"