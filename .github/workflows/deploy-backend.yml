name: Deploy Backend to Cloud Run

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
      - "Dockerfile"
  workflow_dispatch:

env:
  PROJECT_ID: oskortana
  SERVICE_NAME: kortana-backend
  REGION: us-west1

jobs:
  deploy:
    if: false  # Cloud Run disabled — Railway is primary production target
    runs-on: ubuntu-latest

    permissions:
      contents: "read"
      id-token: "write"

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker
        run: gcloud auth configure-docker --quiet

      - name: Build and push Docker image
        run: |
          docker build -t gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA .
          docker push gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy $SERVICE_NAME \
            --image gcr.io/$PROJECT_ID/$SERVICE_NAME:$GITHUB_SHA \
            --platform managed \
            --region $REGION \
            --allow-unauthenticated \
            --port 8000 \
            --memory 1Gi \
            --cpu 1 \
            --min-instances 0 \
            --max-instances 10 \
            --timeout 300 \
            --concurrency 80 \
            --set-env-vars "ENVIRONMENT=production" \
            --set-secrets "GEMINI_API_KEY=GEMINI_API_KEY:latest" \
            --set-secrets "GITHUB_TOKEN=GITHUB_TOKEN:latest"

      - name: Get service URL
        run: |
          SERVICE_URL=$(gcloud run services describe $SERVICE_NAME --region=$REGION --format="value(status.url)")
          echo "Backend deployed to: $SERVICE_URL"
          echo "SERVICE_URL=$SERVICE_URL" >> $GITHUB_OUTPUT

      - name: Health check
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.service_url }}"
          echo "Testing health endpoint: $SERVICE_URL/api/health"

          # Wait for service to be ready
          for i in {1..30}; do
            if curl -f -s "$SERVICE_URL/api/health" > /dev/null; then
              echo "✅ Backend health check passed"
              break
            fi
            echo "Waiting for backend to be ready... ($i/30)"
            sleep 10
          done

          # Final health check
          if curl -f -s "$SERVICE_URL/api/health" > /dev/null; then
            echo "🎉 Backend deployment successful!"
            echo "URL: $SERVICE_URL"
          else
            echo "❌ Backend health check failed"
            exit 1
          fi

      - name: Update deployment info
        run: |
          SERVICE_URL="${{ steps.deploy.outputs.service_url }}"
          echo "Backend deployed successfully!" >> DEPLOYMENT_LOG.md
          echo "URL: $SERVICE_URL" >> DEPLOYMENT_LOG.md
          echo "Timestamp: $(date -u)" >> DEPLOYMENT_LOG.md
          echo "---" >> DEPLOYMENT_LOG.md

          # Commit deployment log
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add DEPLOYMENT_LOG.md
          git commit -m "docs: log backend deployment to Cloud Run" || true
          git push || true
