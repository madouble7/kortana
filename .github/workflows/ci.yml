name: KOR'TANA CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend Tests (Ruff, MyPy, Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run Ruff
        run: |
          cd backend
          ruff check .
      - name: Run MyPy
        run: |
          cd backend
          mypy src/kortana/main.py src/kortana/auth.py src/kortana/schemas.py src/kortana/config.py
      - name: Run Pytest
        run: |
          cd backend
          pytest

  test-frontend:
    name: Frontend Tests (Lint, Type-check, Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm ci || npm install
        working-directory: ./frontend
      - name: Run Lint
        run: npm run lint
        working-directory: ./frontend
      - name: Run Type-check
        run: npm run type-check
        working-directory: ./frontend
      - name: Build Frontend
        run: npm run build
        working-directory: ./frontend

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4
      
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Deploy Backend to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
        run: |
          npx @railway/cli up -s ${{ secrets.RAILWAY_SERVICE_ID }} -e production
        working-directory: ./backend

      - name: Deploy Frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel build --prod --token $VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token $VERCEL_TOKEN
        working-directory: ./frontend
