name: KOR'TANA CI/CD Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test-backend:
    name: Backend Tests (Ruff, MyPy, Pytest)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
      - name: Install backend dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt
      - name: Run Ruff
        run: |
          cd backend
          ruff check .
      - name: Run MyPy
        run: |
          cd backend
          mypy src/kortana/main.py src/kortana/auth.py src/kortana/schemas.py src/kortana/config.py --ignore-missing-imports --follow-imports=silent
      - name: Run Pytest
        run: |
          cd backend
          pytest

  test-frontend:
    name: Frontend Tests (Lint, Type-check, Build)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: Install frontend dependencies
        run: npm ci || npm install
        working-directory: ./frontend
      - name: Run Lint
        run: npm run lint
        working-directory: ./frontend
      - name: Run Type-check
        run: npm run type-check
        working-directory: ./frontend
      - name: Build Frontend
        run: npm run build
        working-directory: ./frontend

  deploy-production:
    name: Deploy to Production
    runs-on: ubuntu-latest
    needs: [test-backend, test-frontend]
    if: github.ref == 'refs/heads/main'
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Railway CLI
        run: npm install -g @railway/cli@latest

      - name: Deploy Web Service to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_WEB_SERVICE_NAME: ${{ secrets.RAILWAY_WEB_SERVICE_NAME || secrets.RAILWAY_SERVICE_NAME }}
        run: |
          if [ -z "$RAILWAY_WEB_SERVICE_NAME" ]; then
            echo "Missing RAILWAY_WEB_SERVICE_NAME (or legacy RAILWAY_SERVICE_NAME) secret"
            exit 1
          fi
          railway up --service "$RAILWAY_WEB_SERVICE_NAME" --environment production --detach
        working-directory: ./backend

      - name: Post-deploy health check
        env:
          KORTANA_BACKEND_URL: ${{ secrets.KORTANA_BACKEND_URL }}
        run: |
          echo "Waiting 30s for containers to start..."
          sleep 30
          for i in $(seq 1 10); do
            STATUS=$(curl -s -o /dev/null -w "%{http_code}" "${KORTANA_BACKEND_URL}/api/health" 2>/dev/null || echo "000")
            if [ "$STATUS" = "200" ]; then
              echo "✓ Health check passed (HTTP 200)"
              exit 0
            fi
            echo "Attempt $i/10: HTTP $STATUS — retrying in 15s..."
            sleep 15
          done
          echo "✗ Health check failed after 10 attempts"
          exit 1

      - name: Deploy Daemon Service to Railway
        env:
          RAILWAY_TOKEN: ${{ secrets.RAILWAY_TOKEN }}
          RAILWAY_DAEMON_SERVICE_NAME: ${{ secrets.RAILWAY_DAEMON_SERVICE_NAME }}
        run: |
          if [ -z "$RAILWAY_DAEMON_SERVICE_NAME" ]; then
            echo "Missing RAILWAY_DAEMON_SERVICE_NAME secret"
            exit 1
          fi
          railway up --service "$RAILWAY_DAEMON_SERVICE_NAME" --environment production --detach
        working-directory: ./backend

      - name: Post-deploy daemon heartbeat check
        env:
          KORTANA_BACKEND_URL: ${{ secrets.KORTANA_BACKEND_URL }}
        run: |
          echo "Waiting 60s for the daemon worker to complete its first cycle..."
          sleep 60
          python -c "import json, os, sys, urllib.request; base=os.environ['KORTANA_BACKEND_URL'].rstrip('/'); data=json.load(urllib.request.urlopen(f'{base}/api/daemon/status', timeout=30)); external=data.get('external_daemon') or {}; print(json.dumps(data, indent=2)); sys.exit(0 if external.get('alive') else 1)"

      - name: Deploy Frontend to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          npx vercel build --prod --token $VERCEL_TOKEN
          npx vercel deploy --prebuilt --prod --token $VERCEL_TOKEN
        working-directory: ./frontend
