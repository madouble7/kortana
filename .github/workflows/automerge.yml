name: Autonomous Merge

on:
  pull_request:
    types: [opened, synchronize, reopened]
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  automerge:
    runs-on: ubuntu-latest
    if: >
      startsWith(github.head_ref, 'auto-fix/') ||
      startsWith(github.head_ref, 'evolve/') ||
      startsWith(github.head_ref, 'auto-repair/')
    steps:
      - name: Generate bot token
        id: bot-token
        uses: actions/create-github-app-token@v1
        with:
          app-id: ${{ secrets.KORTANA_BOT_APP_ID }}
          private-key: ${{ secrets.KORTANA_BOT_PRIVATE_KEY }}

      - name: Approve PR (bot identity)
        run: |
          gh pr review "${{ github.event.pull_request.number }}" \
            --approve \
            --body "auto-approved by kor'tana[bot]"
        env:
          GH_TOKEN: ${{ steps.bot-token.outputs.token }}

      - name: Merge (auto if checks required, direct otherwise)
        run: |
          PR="${{ github.event.pull_request.number }}"
          TITLE="$(gh pr view "$PR" --json title --jq .title)"
          gh pr merge "$PR" --auto --squash --delete-branch \
            || gh pr merge "$PR" --squash --delete-branch --subject "$TITLE"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
