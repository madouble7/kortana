name: Autonomous Merge

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  check_suite:
    types: [completed]

jobs:
  autoupdate:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft &&
      github.event.pull_request.user.login == 'kortana-autonomous[bot]'

  automerge:
    runs-on: ubuntu-latest
    if: >
      github.event_name == 'check_suite' &&
      github.event.check_suite.conclusion == 'success' &&
      github.event.check_suite.head_branch != github.event.repository.default_branch &&
      github.actor == 'kortana-autonomous[bot]'

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
      with:
        token: ${{ secrets.KORTANA_AUTONOMOUS_TOKEN }}
        fetch-depth: 0

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '18'
        cache: 'npm'

    - name: Setup Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Install dependencies
      run: |
        npm ci
        pip install -r backend/requirements.txt

    - name: Run tests
      run: |
        npm test
        python -m pytest backend/tests/ -v

    - name: Check branch protection
      id: check-protection
      run: |
        BRANCH="${{ github.event.check_suite.head_branch }}"
        echo "Checking protection for branch: $BRANCH"

        # Check if branch matches autonomous patterns
        if [[ "$BRANCH" =~ ^(feature|ritual)/task_.* ]]; then
          echo "Branch matches autonomous pattern"
          echo "autonomous=true" >> $GITHUB_OUTPUT
        else
          echo "Branch does not match autonomous pattern"
          echo "autonomous=false" >> $GITHUB_OUTPUT
        fi

    - name: Autonomous merge
      if: steps.check-protection.outputs.autonomous == 'true'
      run: |
        BRANCH="${{ github.event.check_suite.head_branch }}"
        BASE_BRANCH="${{ github.event.repository.default_branch }}"

        echo "🚀 Initiating autonomous merge..."
        echo "Branch: $BRANCH"
        echo "Base: $BASE_BRANCH"

        # Get PR number from branch
        PR_NUMBER=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
        echo "PR Number: $PR_NUMBER"

        if [ -z "$PR_NUMBER" ]; then
          echo "❌ No PR found for branch $BRANCH"
          exit 1
        fi

        # Verify all checks passed
        CHECKS_PASSED=$(gh pr checks "$PR_NUMBER" --json conclusion --jq 'all(.conclusion == "SUCCESS")')
        echo "All checks passed: $CHECKS_PASSED"

        if [ "$CHECKS_PASSED" != "true" ]; then
          echo "❌ Not all checks have passed"
          exit 1
        fi

        # Merge the PR autonomously
        echo "🔄 Merging PR #$PR_NUMBER..."
        gh pr merge "$PR_NUMBER" --merge --delete-branch=false

        # Log the autonomous merge
        echo "✅ Autonomous merge completed for $BRANCH"

        # Update covenant index
        ./scripts/update_covenant.py merge "$BRANCH" "$BASE_BRANCH" "$PR_NUMBER"

      env:
        GITHUB_TOKEN: ${{ secrets.KORTANA_AUTONOMOUS_TOKEN }}

    - name: Post-merge cleanup
      if: steps.check-protection.outputs.autonomous == 'true'
      run: |
        BRANCH="${{ github.event.check_suite.head_branch }}"

        # Clean up merged branch
        echo "🧹 Cleaning up merged branch: $BRANCH"
        git push origin --delete "$BRANCH" || echo "Branch deletion failed, may have been already deleted"

        # Log cleanup action
        ./scripts/update_covenant.py cleanup "$BRANCH"

      env:
        GITHUB_TOKEN: ${{ secrets.KORTANA_AUTONOMOUS_TOKEN }}

  notify-failure:
    runs-on: ubuntu-latest
    if: failure() && github.event_name == 'check_suite'
    needs: automerge

    steps:
    - name: Notify merge failure
      run: |
        BRANCH="${{ github.event.check_suite.head_branch }}"
        CONCLUSION="${{ github.event.check_suite.conclusion }}"

        echo "❌ Autonomous merge failed for branch: $BRANCH"
        echo "Check suite conclusion: $CONCLUSION"

        # Log the failure
        ./scripts/update_covenant.py failure "$BRANCH" "automerge" "$CONCLUSION"

      env:
        GITHUB_TOKEN: ${{ secrets.KORTANA_AUTONOMOUS_TOKEN }}
