name: Daily Sync Ritual

on:
  schedule:
    - cron: '0 6 * * *'  # Run daily at 6 AM UTC
  workflow_dispatch:

permissions:
  contents: write  # Need write permission to commit logs

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        token: ${{ secrets.GITHUB_TOKEN }}

    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: Generate autonomy heartbeat log
      run: |
        python scripts/deployment/daily_sync.py

    - name: Commit autonomy logs
      run: |
        git config user.name "kortana-autonomous[bot]"
        git config user.email "bot@kortana.dev"
        git add logs/autonomy/ || true
        git diff --quiet || git commit -m "🤖 Autonomy heartbeat: $(date +%Y-%m-%d)" || true
        git push || true
