name: Security Scanning

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]
  schedule:
    # Weekly security scan on Sunday
    - cron: "0 0 * * 0"

permissions:
  contents: read

jobs:
  # ==================== Dependency Scanning ====================
  dependency-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install security tools
        run: |
          pip install pip-audit safety

      - name: Run pip-audit
        run: |
          cd backend
          pip-audit --require-hashes || true

      - name: Run safety check
        run: |
          cd backend
          safety check -r requirements.txt --json-output-file safety-report.json || true

      - name: Upload safety report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: safety-report
          path: backend/safety-report.json

  # ==================== Container Scanning ====================
  container-scan:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build Docker image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          load: true
          tags: kortana:test

      - name: Run Trivy vulnerability scan
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: "kortana:test"
          format: "table"
          exit-code: "1"
          severity: "CRITICAL,HIGH"
          timeout: "5m"

      - name: Run Trivy config scan
        uses: aquasecurity/trivy-action@master
        with:
          scan-type: "config"
          scan-ref: "./backend/Dockerfile"
          severity: "CRITICAL,HIGH"

  # ==================== Secret Detection ====================
  secret-detection:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          extra_args: --base64 --zip

      - name: Check for tracked environment files
        run: |
          tracked_env_files=$(git ls-files | grep -E '(^|/)\.env(\..+)?$' | grep -vE '(^|/)\.env\.example$' | grep -vE '^frontend/\.env\.' || true)
          if [ -n "$tracked_env_files" ]; then
            echo "::error::Found tracked environment files in repository:"
            echo "$tracked_env_files"
            exit 1
          fi

  # ==================== Code Security Scanning ====================
  code-security:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Bandit
        run: |
          pip install bandit

      - name: Run Bandit security analysis
        run: |
          cd backend
          bandit -r . -f json -o bandit-report.json
        continue-on-error: true

      - name: Upload Bandit report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bandit-report
          path: backend/bandit-report.json

      - name: Print Bandit summary
        run: |
          cd backend
          if [ -f bandit-report.json ]; then
            echo "Bandit scan completed. Issues found - see artifact for details."
          fi

  # ==================== Dependency Vulnerability Summary ====================
  vulnerability-summary:
    needs: [dependency-scan, container-scan, secret-detection, code-security]
    runs-on: ubuntu-latest
    permissions: {}
    if: always()
    steps:
      - name: Download all reports
        uses: actions/download-artifact@v4
        with:
          path: reports

      - name: Create summary comment
        run: |
          echo "## Security Scan Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "✅ Security scans completed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Reports available:**" >> $GITHUB_STEP_SUMMARY
          echo "- Safety report (dependencies)" >> $GITHUB_STEP_SUMMARY
          echo "- Trivy container scan" >> $GITHUB_STEP_SUMMARY
          echo "- TruffleHog secret detection" >> $GITHUB_STEP_SUMMARY
          echo "- Bandit code security" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Note:** Some tools may have found non-critical issues. Review artifacts for details." >> $GITHUB_STEP_SUMMARY

  # ==================== Fail on Critical Issues ====================
  security-gate:
    needs: [vulnerability-summary]
    runs-on: ubuntu-latest
    permissions: {}
    if: failure()
    steps:
      - name: Fail on critical security issues
        run: |
          echo "::error::Security scan failed! Please review the security reports above."
          exit 1
