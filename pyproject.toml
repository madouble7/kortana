[tool.poetry]
name = "project-kortana"
version = "0.1.0"
description = ""
authors = ["codex-bot <codex-bot@example.com>"]
readme = "README.md"

[tool.poetry.dependencies]
python = "^3.11"
fastapi = ">=0.115.0"
uvicorn = {extras = ["standard"], version = ">=0.31.0"}
sqlalchemy = ">=2.0.35"
psycopg2-binary = ">=2.9.9"
alembic = ">=1.13.0"
openai = ">=1.54.0"
pydantic = ">=2.9.0"
pydantic-settings = ">=2.5.0"
sentence-transformers = ">=3.1.0"
torch = ">=2.1.0"
numpy = ">=1.26.0"
httpx = ">=0.27.0"
apscheduler = ">=3.10.4"
pinecone = ">=5.0.0"
cryptography = ">=46.0.5"
scikit-learn = ">=1.2.2"
xgboost = ">=1.7.0"
pandas = ">=2.0.0"
plotly = ">=5.14.0"

[project]
name = "project-kortana"
version = "0.1.0"
description = "Kor'tana AI Agent System"
requires-python = ">=3.11"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.31.0",
    "sqlalchemy>=2.0.35",
    "alembic>=1.13.0",
    "openai>=1.54.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    "httpx>=0.27.0",
    "apscheduler>=3.10.4",
    "cryptography>=46.0.5",
    "scikit-learn>=1.2.2",
    "xgboost>=1.7.0",
    "pandas>=2.0.0",
    "plotly>=5.14.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.4.0",
    "pytest-cov>=4.1.0",
    "pytest-asyncio>=0.21.0",
    "httpx>=0.27.0",
    "ruff>=0.1.0",
    "mypy>=1.7.0",
]
# For accurate token counting in LobeChat integration
lobechat = [
    "tiktoken>=0.5.0",
]

[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
kortana = ["py.typed"]
