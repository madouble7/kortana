[pytest]
# Pytest configuration for Kor'tana Backend

# Test discovery patterns
python_files = test_*.py *_test.py
python_classes = Test*
python_functions = test_*

# Output options
addopts =
    -v
    --strict-markers
    --tb=short
    --disable-warnings
    -ra

# Coverage options
testpaths = tests

# Markers
markers =
    unit: Unit tests (fast, no external dependencies)
    integration: Integration tests (slower, may use external dependencies)
    async: Async/await tests
    slow: Slow running tests
    db: Database tests
    api: API endpoint tests
    auth: Authentication tests
    security: Security tests

# Timeout for tests (seconds)
timeout = 300

# Minimum Python version
minversion = 3.9

# Logging
log_cli = false
log_cli_level = INFO
log_cli_format = %(asctime)s [%(levelname)8s] %(message)s

# Asyncio mode
asyncio_mode = auto
