# Render.com deployment configuration
# Docs: https://docs.render.com/blueprint-spec

services:
  - type: web
    name: kortana-api
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "alembic upgrade head && uvicorn src.kortana.main:app --host 0.0.0.0 --port $PORT"
    healthCheckPath: /api/health
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: KORTANA_AUTONOMOUS_MODE
        value: "true"
      - key: KORTANA_DAEMON_IN_PROCESS
        value: "false"
      - key: AUTONOMY_DAEMON_ENABLED
        value: "false"
      - key: AUTONOMY_CYCLE_INTERVAL
        value: "120"
      - key: PYTHON_VERSION
        value: "3.11.7"
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SESSION_SALT
        sync: false
      - key: HEARTBEAT_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false

  - type: worker
    name: kortana-daemon
    runtime: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: sh -c "alembic upgrade head && python -m src.kortana.daemon_worker"
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: KORTANA_AUTONOMOUS_MODE
        value: "true"
      - key: KORTANA_DAEMON_IN_PROCESS
        value: "false"
      - key: AUTONOMY_DAEMON_ENABLED
        value: "true"
      - key: AUTONOMY_CYCLE_INTERVAL
        value: "120"
      - key: PYTHON_VERSION
        value: "3.11.7"
      - key: SECRET_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GITHUB_TOKEN
        sync: false
      - key: OPENAI_API_KEY
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: GROQ_API_KEY
        sync: false
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: SESSION_SALT
        sync: false
      - key: HEARTBEAT_TOKEN
        sync: false
      - key: GITHUB_WEBHOOK_SECRET
        sync: false
      - key: DISCORD_BOT_TOKEN
        sync: false
      - key: CORS_ORIGINS
        sync: false
