# Docker Compose for Local Development
# Optimized with hot reload, proper volume mounts, and health checks

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: kortana-postgres
    environment:
      POSTGRES_USER: ${DB_USER:-kortana}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-kortana_dev}
      POSTGRES_DB: ${DB_NAME:-kortana_db}
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-kortana}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kortana-network
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    restart: unless-stopped

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: kortana-redis
    command: redis-server --appendonly yes
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - kortana-network
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    restart: unless-stopped

  # Backend API (Development)
  backend:
    build:
      context: .
      dockerfile: Dockerfile
      cache_from:
        - type=gha
    container_name: kortana-backend
    env_file:
      - .env
    environment:
      DATABASE_URL: postgresql://${DB_USER:-kortana}:${DB_PASSWORD:-kortana_dev}@postgres:5432/${DB_NAME:-kortana_db}
      REDIS_URL: redis://redis:6379
      ENVIRONMENT: development
      LOG_LEVEL: debug
      PYTHONUNBUFFERED: "1"
      KORTANA_WORKSPACE_ROOT: /workspace
      DISCORD_ENABLED: "false"
      KORTANA_DEFAULT_APPROVAL_MODE: "auto"
      KORTANA_GITHUB_MODE: "full"
      KORTANA_LOCAL_BACKLOG_ENABLED: "true"
      KORTANA_SELF_AWARE_APPROVAL: "false"
    ports:
      - "${API_PORT:-8000}:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      # Hot reload: mount source code for live changes
      - ./backend/src:/app/src
      - ./backend/migrations:/app/migrations
      - .:/workspace
    command: uvicorn src.kortana.main:app --host 0.0.0.0 --port 8000 --reload
    networks:
      - kortana-network
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    restart: unless-stopped

  # Frontend Dev Server
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
      cache_from:
        - type=gha
    container_name: kortana-frontend
    ports:
      - "${FRONTEND_PORT:-3000}:5173"
    depends_on:
      - backend
    volumes:
      # Hot reload: mount source for live changes
      - ./frontend/src:/app/src
      - ./frontend/public:/app/public
      - /app/node_modules
    environment:
      VITE_API_URL: http://backend:8000
    command: npm run dev -- --host
    networks:
      - kortana-network
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "0.5"
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:

networks:
  kortana-network:
    driver: bridge
